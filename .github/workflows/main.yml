name: Build binary
permissions: read-all

on:
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    name: Build binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_version: [Debug, Release]
    timeout-minutes: 30

    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        working-directory: teeio-validator
        run: |
          mkdir -p build
          cd build
          cmake -DARCH=x64 -DTOOLCHAIN=GCC -DTARGET=${{ matrix.build_version }} -DCRYPTO=mbedtls ..
          make -j"$(nproc)"

      - name: List built binaries
        run: ls -la teeio-validator/build/bin

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: teeio-validator-${{ matrix.build_version }}
          path: teeio-validator/build/bin/
          if-no-files-found: error
          retention-days: 30
